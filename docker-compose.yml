services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aia_password}
      POSTGRES_DB: ${POSTGRES_DB:-aia_db}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-aia_user} -d ${POSTGRES_DB:-aia_db}
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=5).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aia_user:aia_password@db:5432/aia_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-with-a-random-64-char-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@AIA2026!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","https://sefako-ai-studio.it-sefako.com"]}
      IDE_PUBLIC_URL: ${IDE_PUBLIC_URL:-https://ide.it-sefako.com}
      DEBUG: ${DEBUG:-false}
    volumes:
    - projects_data:/projects
    - qwen_config:/root/.qwen
    expose:
    - '8000'
    depends_on:
      db:
        condition: service_healthy
    labels:
    - traefik.enable=true
    - traefik.http.routers.sefako-ai-studio-backend.rule=Host(`${API_DOMAIN}`)
    - traefik.http.routers.sefako-ai-studio-backend.priority=100
    - traefik.http.routers.sefako-ai-studio-backend.entrypoints=websecure
    - traefik.http.routers.sefako-ai-studio-backend.tls.certresolver=myresolver
    - traefik.http.services.sefako-ai-studio-backend.loadbalancer.server.port=8000
    - traefik.docker.network=proxy_net
    env_file: .env
    networks:
    - default
    - proxy_net
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_API_DOMAIN: ${API_DOMAIN:-api-sefako-ai-studio.it-sefako.com}
        NEXT_PUBLIC_IDE_PUBLIC_URL: ${IDE_PUBLIC_URL:-https://ide.it-sefako.com}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3000'').then(r => process.exit(r.ok ? 0 : 1)).catch(()
        => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_API_DOMAIN: ${API_DOMAIN:-api-sefako-ai-studio.it-sefako.com}
      NEXT_PUBLIC_IDE_PUBLIC_URL: ${IDE_PUBLIC_URL:-https://ide.it-sefako.com}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    expose:
    - '3000'
    depends_on:
    - backend
    labels:
    - traefik.enable=true
    - traefik.http.routers.sefako-ai-studio-frontend.rule=Host(`${FRONTEND_DOMAIN}`)
    - traefik.http.routers.sefako-ai-studio-frontend.priority=1
    - traefik.http.routers.sefako-ai-studio-frontend.entrypoints=websecure
    - traefik.http.routers.sefako-ai-studio-frontend.tls.certresolver=myresolver
    - traefik.http.services.sefako-ai-studio-frontend.loadbalancer.server.port=3000
    - traefik.docker.network=proxy_net
    env_file: .env
    networks:
    - default
    - proxy_net
  ide:
    build:
      context: ./ide
    restart: unless-stopped
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-change-this-code-server-password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TZ: ${TZ:-Africa/Lome}
    volumes:
    - projects_data:/projects
    - ide_data:/home/coder/.local/share/code-server
    - ide_config:/home/coder/.config/code-server
    expose:
    - '8080'
    labels:
    - traefik.enable=true
    - traefik.http.routers.sefako-ai-studio-ide.rule=Host(`${IDE_DOMAIN}`)
    - traefik.http.routers.sefako-ai-studio-ide.entrypoints=websecure
    - traefik.http.routers.sefako-ai-studio-ide.tls.certresolver=myresolver
    - traefik.http.services.sefako-ai-studio-ide.loadbalancer.server.port=8080
    - traefik.docker.network=proxy_net
    env_file: .env
    networks:
    - default
    - proxy_net
volumes:
  postgres_data: null
  qwen_config: null
  projects_data: null
  ide_data: null
  ide_config: null
networks:
  proxy_net:
    external: true

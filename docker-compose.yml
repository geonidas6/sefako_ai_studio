services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aia_password}
      POSTGRES_DB: ${POSTGRES_DB:-aia_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aia_user} -d ${POSTGRES_DB:-aia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aia_user:aia_password@db:5432/aia_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-with-a-random-64-char-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@AIA2026!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OPENHANDS_INTERNAL_URL: ${OPENHANDS_INTERNAL_URL:-http://openhands:8000}
      OPENHANDS_AGENT_SERVER_URL: ${OPENHANDS_AGENT_SERVER_URL:-http://openhands:18000}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","https://sefako-ai-studio.it-sefako.com"]}
      OPENHANDS_PUBLIC_URL: ${OPENHANDS_PUBLIC_URL:-https://open-hand-sefako-ai-studio.it-sefako.com}
      DEBUG: ${DEBUG:-false}
    volumes:
      - projects_data:/projects
      - qwen_config:/root/.qwen
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_API_DOMAIN: ${API_DOMAIN:-api-sefako-ai-studio.it-sefako.com}
        OPENHANDS_INTERNAL_URL: ${OPENHANDS_INTERNAL_URL:-http://openhands:8000}
        OPENHANDS_AGENT_SERVER_URL: ${OPENHANDS_AGENT_SERVER_URL:-http://openhands:18000}
        NEXT_PUBLIC_OPENHANDS_BASE_URL: ${OPENHANDS_BASE_URL:-/openhands}
        NEXT_PUBLIC_OPENHANDS_PUBLIC_URL: ${OPENHANDS_PUBLIC_URL:-https://open-hand-sefako-ai-studio.it-sefako.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_API_DOMAIN: ${API_DOMAIN:-api-sefako-ai-studio.it-sefako.com}
      OPENHANDS_INTERNAL_URL: ${OPENHANDS_INTERNAL_URL:-http://openhands:8000}
      OPENHANDS_AGENT_SERVER_URL: ${OPENHANDS_AGENT_SERVER_URL:-http://openhands:18000}
      NEXT_PUBLIC_OPENHANDS_BASE_URL: ${OPENHANDS_BASE_URL:-/openhands}
      NEXT_PUBLIC_OPENHANDS_PUBLIC_URL: ${OPENHANDS_PUBLIC_URL:-https://open-hand-sefako-ai-studio.it-sefako.com}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    expose:
      - "3000"
    depends_on:
      - backend

  openhands:
    image: ghcr.io/openhands/agent-canvas:1.0.0-rc.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - projects_data:/projects
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
volumes:
  postgres_data:
  qwen_config:
  projects_data:

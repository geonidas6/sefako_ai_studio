version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aia_postgres
    restart: always
    environment:
      POSTGRES_USER: aia_user
      POSTGRES_PASSWORD: aia_password
      POSTGRES_DB: aia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aia_user -d aia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: aia_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://aia_user:aia_password@db:5432/aia_db
      - SECRET_KEY=change-this-secret-key-for-jwt-signing-2026
      - ENCRYPTION_KEY=c3B5ZGVyLWtleS1tdXN0LWJlLTMyLWJ5dGVzLWxvbmc=
      - DEBUG=True
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: aia_frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

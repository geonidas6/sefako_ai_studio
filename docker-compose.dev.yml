services:
  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --reload
    environment:
      DEBUG: "true"
    volumes:
      - ./backend/app:/app/app
      - qwen_config:/root/.qwen

  frontend:
    ports:
      - "127.0.0.1:3000:3000"
    build:
      context: ./frontend
      target: deps
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      OPENHANDS_AGENT_SERVER_URL: http://openhands:18000
      OPENHANDS_PUBLIC_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_OPENHANDS_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_OPENHANDS_PUBLIC_URL: http://127.0.0.1:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  qwen_config:
  frontend_node_modules:
  frontend_next_cache:
